services:
  grillabend:
    image: ${GRILLABEND_IMAGE:-ghcr.io/anigx/grillabend-anmeldung:latest}
    container_name: grillabend
    restart: unless-stopped
    ports:
      - "${GRILLABEND_BIND:-127.0.0.1}:${GRILLABEND_HTTP_PORT:-1621}:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      DATA_DIR: /app/data
      HOST: 0.0.0.0
    volumes:
      - grillabend-data:/app/data

volumes:
  grillabend-data:
    name: grillabend-data
