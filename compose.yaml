services:
  grillabend:
    image: ghcr.io/anigx/grillabend-anmeldung:latest
    container_name: grillabend
    restart: unless-stopped
    ports:
      - "127.0.0.1:1621:80"
    environment:
      NODE_ENV: production
      PORT: "80"
      DATA_DIR: /app/data
      HOST: 0.0.0.0
    volumes:
      - grillabend-data:/app/data

volumes:
  grillabend-data:
    name: grillabend-data
