services:
  grillabend:
    image: ${GRILLABEND_IMAGE:-ghcr.io/anigx/grillabend-anmeldung:latest}
    container_name: grillabend
    restart: unless-stopped
    ports:
      - "127.0.0.1:621:621"
    environment:
      NODE_ENV: production
      PORT: "621"
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN in .env.windows als HTTP-Origin eintragen}
    volumes:
      - grillabend-data:/app/data

volumes:
  grillabend-data:
    name: grillabend-data
