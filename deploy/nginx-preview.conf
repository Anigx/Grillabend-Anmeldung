# Nur für die kurzlebige GitHub-VM: cloudflared liefert HTTPS an diesen lokalen Proxy.
server {
    listen 127.0.0.1:8080;
    server_name _;
    # The listener is loopback-only. Cloudflare overwrites this header at the tunnel edge.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    # Missing/invalid tunnel identity must not fall back to a shared loopback auth budget.
    if ($remote_addr = 127.0.0.1) { return 403; }
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:1621;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
    }
}
